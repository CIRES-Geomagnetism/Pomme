[project]
name = "pomme"
version = "0.1.10"
description = "A Python wrapper for the POMME-10 geomagnetic field model"
authors = [ {name = "Liam Kilcommons", email = "liam.kilcommons@noaa.gov"},
    { name = "Li-Yin Young", email = "liyin.young@noaa.gov" }]

requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/CIRES-Geomagnetism/Pomme.git"
