name: Test wheels building in cross-platform

on:
    pull_request:
        branches:
        - main

jobs:
  build-liunx-wheels:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "cp311", "cp312", "cp313", "cp314" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_ARCHS: "x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BUILD: "${{ matrix.python-version }}-*"
          # Skip to build musllinux and 32-bit manylinux wheels
          CIBW_SKIP: "*-musllinux* *-manylinux_i686"
          # Multi-threaded for C compiler
          MAKEFLAGS: "-j$(nproc)"
          CIBW_TEST_COMMAND: "python -c \"import pomme.pypomme\" && python {project}/tests/smoke_test_pypomme.py"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-ununtu-latests-${{ matrix.python-version }}
          path: wheelhouse/*.whl
          retention-days: 1

  build-windows-wheels:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: [ "cp311", "cp312", "cp313", "cp314" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_BUILD: "${{ matrix.python-version }}-*"
          CIBW_BEFORE_BUILD_WINDOWS: "python -m pip install --upgrade pip delvewheel"
          # Only output 64-bit wheels for Windows
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_TEST_COMMAND: "python -c \"import pomme.pypomme\" && python {project}/tests/smoke_test_pypomme.py"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair --add-path C:\\\\msys64\\\\mingw64\\\\bin -w {dest_dir} {wheel}"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-latest-${{ matrix.python-version }}
          path: wheelhouse/*.whl
          retention-days: 1

  build-mac-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: [ "cp311", "cp312", "cp313", "cp314" ]
        os: [ "macos-latest", "macos-26-intel" ]
        include:
          - os: "macos-latest"
            arch: "arm64"
          - os: "macos-26-intel"
            arch: "x86_64"

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_BUILD: "${{ matrix.python-version }}-*"
          CIBW_ARCHS_MACOS: "${{ matrix.arch }}"
          # Set the OS floor (11.0 is a safe modern bet for universal2)
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          CIBW_TEST_COMMAND: "python -c \"import pomme.pypomme\" && python {project}/tests/smoke_test_pypomme.py"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: wheelhouse/*.whl
          retention-days: 1

  test-wheels:
    needs: [ build-windows-wheels, build-liunx-wheels, build-mac-wheels ]
    runs-on: ${{ matrix.os }}
    strategy:
        matrix:
            os: [ "windows-latest", "ubuntu-latest", "macos-latest", "macos-26-intel" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-${{ matrix.os }}-*
          path: dist
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install wheels
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install dist/*.whl

      - name: Test wheels
        shell: bash
        run: |
          python -c "import pomme.pypomme"
          python tests/smoke_test_pypomme.py

  dry-run-release:
    needs: test-wheels
    runs-on: ubuntu-latest
    steps:

    - name: Download built wheels
      uses: actions/download-artifact@v4
      with:
        pattern: wheels-*
        path: dist
        merge-multiple: true

    - name: List Wheels
      run: ls -R dist

    - name: Upload wheels to Github Release
      uses: softprops/action-gh-release@v1

      with:
        draft: true
        files: dist/*.whl
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

