name: Pomme pull request ci pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  run-all-unit-tests:
    if: github.event.pull_request.draft == false  # ❗ Skip if draft == true
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    -  name: Install dependencies
       run: |
         pip install -r requirements.txt

    - name: Build and install Pomme Python wrapper
      run: |
        python -m build
        pip install -e .

    - name: Unit tests
      run: |
        py.test

  build-liunx-wheel:
    needs: run-all-unit-tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["cp311", "cp312", "cp313", "cp314"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_ARCHS: "x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BUILD: "${{ matrix.python-version }}-*"
          # Skip to build musllinux and 32-bit manylinux wheels
          CIBW_SKIP: "*-musllinux* *-manylinux_i686"
          # Multi-threaded for C compiler
          MAKEFLAGS: "-j$(nproc)"
          CIBW_TEST_COMMAND: "python -c \"import pomme.pypomme\" && python {project}/tests/smoke_test_pypomme.py"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-ununtu-latests-${{ matrix.python-version }}
          path: wheelhouse/*.whl
          retention-days: 1

  build-windows-wheel:
    needs: run-all-unit-tests
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["cp311", "cp312", "cp313", "cp314"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_BUILD: "${{ matrix.python-version }}-*"
          CIBW_BEFORE_BUILD_WINDOWS: "python -m pip install --upgrade pip delvewheel"
          # Only output 64-bit wheels for Windows
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_TEST_COMMAND: "python -c \"import pomme.pypomme\" && python {project}/tests/smoke_test_pypomme.py"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair --add-path C:\\\\msys64\\\\mingw64\\\\bin -w {dest_dir} {wheel}"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-latest-${{ matrix.python-version }}
          path: wheelhouse/*.whl
          retention-days: 1

