name: Build Windows Wheel

on:
  push:
    branches: ["-manylinux_2_28"] # Assign the branch that triggers this workflow

jobs:
  build-wheel:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["cp311","cp312","cp313","cp314"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Force to build in D to avoid I/O bottleneck on C drive
      - name: Set TEMP to D:/Temp
        run: |
            mkdir "D:\Temp"
            echo "TEMP=D:\Temp" >> $env:GITHUB_ENV
            echo "TMP=D:\Temp" >> $env:GITHUB_ENV
      # Add this step to install uv
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Install dependencies
        run: pip install delvewheel

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_BUILD: "${{ matrix.python-version }}-*"
          CIBW_BUILD_FRONTEND: "build[uv]"
          # Only output 64-bit wheels for Windows
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_TEST_COMMAND: "python -c \"import pomme.pypomme\" && python {project}/tests/smoke_test_pypomme.py"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair --add-path C:\\\\msys64\\\\mingw64\\\\bin -w {dest_dir} {wheel}"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
            name: wheels-${{ matrix.python-version }}
            path: wheelhouse/*.whl

  release-wheel:
    needs: build-wheel
    runs-on: ubuntu-latest
    steps:
      - name: Download built wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Upload wheels to Github Release
        uses: softprops/action-gh-release@v1

        with:
          draft: true
          files: dist/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}