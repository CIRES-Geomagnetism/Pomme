name: Build Windows Wheel

on:
  push:
    branches: ["remove_uv"] # Assign the branch that triggers this workflow

jobs:
  build-wheel:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["cp313"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4



      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_BUILD: "${{ matrix.python-version }}-*"
          CIBW_BEFORE_BUILD_WINDOWS: "python -m pip install --upgrade pip delvewheel"
          # Only output 64-bit wheels for Windows
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_TEST_COMMAND: "python -c \"import pomme.pypomme\" && python {project}/tests/smoke_test_pypomme.py"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair --add-path C:\\\\msys64\\\\mingw64\\\\bin -w {dest_dir} {wheel}"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
            name: wheels-${{ matrix.python-version }}
            path: wheelhouse/*.whl
            retention-days: 1

  test-wheel:
    needs: build-wheel
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download built wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install wheels
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install dist/*.whl
      - name: Test wheels
        shell: bash
        run: |
          python -c "import pomme.pypomme"
          python tests/smoke_test_pypomme.py