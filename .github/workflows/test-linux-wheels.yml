name: Test the linux 2_28 wheels

on:
  push:
    branches: ["remove_uv"]

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "cp313" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_ARCHS: "x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BUILD: "${{ matrix.python-version }}-*"
          # Skip to build musllinux and 32-bit manylinux wheels
          CIBW_SKIP: "*-musllinux* *-manylinux_i686"
          # Multi-threaded for C compiler
          MAKEFLAGS: "-j$(nproc)"
          CIBW_TEST_COMMAND: "python -c \"import pomme.pypomme\" && python {project}/tests/smoke_test_pypomme.py"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.python-version }}
          path: wheelhouse/*.whl
          retention-days: 1

  test-wheel:
    needs: build-wheel
    runs-on: ubuntu-latest
    steps:
      - name: Download built wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Install wheels
        run: |
          python -m pip install --upgrade pip
          pip install dist/*.whl
      - name: Test wheels
        run: |
          python -c "import pomme.pypomme"
          python tests/smoke_test_pypomme.py





