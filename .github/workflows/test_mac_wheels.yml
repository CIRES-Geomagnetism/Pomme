name: Test Mac x86_64 and Arm64 Wheels

on:
  push:
    branches:
      - 'remove_uv' # Assign the branch you want to trigger the CI on
jobs:
  build-wheel:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: [ "cp313"]
        os: ["macos-latest", "macos-26-intel"]
        include:
          - os: "macos-latest"
            arch: "arm64"
          - os: "macos-26-intel"
            arch: "x86_64"

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.0
        env:
            CIBW_BUILD: "${{ matrix.python-version }}-*"
            CIBW_ARCHS_MACOS: "${{ matrix.arch }}"
            # Set the OS floor (11.0 is a safe modern bet for universal2)
            MACOSX_DEPLOYMENT_TARGET: "11.0"
            CIBW_TEST_COMMAND: "python -c \"import pomme.pypomme\" && python {project}/tests/smoke_test_pypomme.py"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: wheelhouse/*.whl
          retention-days: 1

  test-wheel:
    needs: build-wheel
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os : ["macos-latest", "macos-26-intel"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download built wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-${{ matrix.os }}-*
          path: dist
          merge-multiple: true

      - name: Install wheels
        run: |
          python -m pip install --upgrade pip
          pip install dist/*.whl

      - name: Test wheels
        run: |
          python -c "import pomme.pypomme"
          python tests/smoke_test_pypomme.py